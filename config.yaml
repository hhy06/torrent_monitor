protocol_version: "2.0"

# =====================================================================
# 种子监控 / qBittorrent 推送工具 V2.0
# 所有相对路径都按"本配置文件所在目录"解析
# =====================================================================
global:
  user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"
  timeout_seconds: 25
  retries: 2
  trust_env: true

# search‑terms mode: auto(自动推送) / manual(GUI人工勾选)
search-terms:
  - name: "wsj"
    mode: auto
    url: "https://thepiratebay10.xyz/user/surferbroadband/"
    title_contains:
      - "wall street journal"
    max_size_mb: 100
    max_age_days: 7

  - name: "newsnight"
    mode: auto
    url: "https://thepiratebay10.xyz/user/BigJ.0554/"
    title_contains:
      - "newsnight"
    max_size_mb: null
    max_age_days: 7

  - name: "nova"
    mode: manual
    url: "https://thepiratebay10.xyz/search/nova/1/3/200"
    title_contains:
      - "nova"
    max_size_mb: null
    max_age_days: 20

  - name: "panorama"
    mode: manual
    url: "https://thepiratebay10.xyz/search/panorama/1/3/200"
    title_contains:
      - "panorama"
    max_size_mb: null
    max_age_days: 20

  - name: "nature"
    mode: manual
    url: "https://thepiratebay10.xyz/search/nature/1/3/200"
    title_contains:
      - "nature"
    max_size_mb: null
    max_age_days: 20

database:
  path: "./torrents.db"

qbittorrent:
  enabled: true
  host: "192.168.1.99"
  port: 8899
  use_https: false
  auth_bypass: true
  username: "admin"
  password: "adminadmin"
  api_base: "/api/v2"
  category: "wsj"
  tags:
    - "auto"
    - "wsj"
  save_path: ""
  paused: false
  timeout_seconds: 15
  record_failures: true

logging:
  level: "INFO"
  file: "./torrent_monitor.log"
